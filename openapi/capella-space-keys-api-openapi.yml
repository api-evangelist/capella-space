openapi: 3.2.0
info:
  title: Capella Space Keys API
  description: 'Capella Space provides on-demand synthetic aperture radar (SAR) imagery

    through a self-service Console and public API.'
  version: 1.0.0
  contact:
    name: Capella Space Support
    url: https://support.capellaspace.com/
servers:
- url: https://api.capellaspace.com
security:
- bearerAuth: []
tags:
- name: Keys
paths:
  /keys:
    post:
      tags:
      - Keys
      summary: Request an API key
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                additionalProperties: true
      operationId: postKeys
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token issued via the Capella Console. API keys can be

        requested at POST /keys and exchanged for bearer tokens per the

        documented authentication flow.

        '
