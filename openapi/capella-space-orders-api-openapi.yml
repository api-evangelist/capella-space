openapi: 3.2.0
info:
  title: Capella Space Orders API
  description: 'Capella Space provides on-demand synthetic aperture radar (SAR) imagery

    through a self-service Console and public API.'
  version: 1.0.0
  contact:
    name: Capella Space Support
    url: https://support.capellaspace.com/
servers:
- url: https://api.capellaspace.com
security:
- bearerAuth: []
tags:
- name: Orders
paths:
  /orders:
    post:
      tags:
      - Orders
      summary: Submit an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      operationId: postOrders
      x-operation-id-source: derived
  /orders/review:
    post:
      tags:
      - Orders
      summary: Review an order before submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Review summary including pricing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      operationId: postOrdersReview
      x-operation-id-source: derived
  /orders/{orderId}/download:
    parameters:
    - in: path
      name: orderId
      required: true
      schema:
        type: string
    get:
      tags:
      - Orders
      summary: Get download URLs for a completed order
      responses:
        '200':
          description: Signed download URLs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
      operationId: getOrdersByOrderIdDownload
      x-operation-id-source: derived
components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
        orderStatus:
          type: string
        userId:
          type: string
      additionalProperties: true
    OrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              granuleId:
                type: string
              collectionId:
                type: string
            additionalProperties: true
      additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token issued via the Capella Console. API keys can be

        requested at POST /keys and exchanged for bearer tokens per the

        documented authentication flow.

        '
