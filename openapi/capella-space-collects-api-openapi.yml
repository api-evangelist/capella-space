openapi: 3.2.0
info:
  title: Capella Space Collects API
  description: 'Capella Space provides on-demand synthetic aperture radar (SAR) imagery

    through a self-service Console and public API.'
  version: 1.0.0
  contact:
    name: Capella Space Support
    url: https://support.capellaspace.com/
servers:
- url: https://api.capellaspace.com
security:
- bearerAuth: []
tags:
- name: Collects
paths:
  /collects/list/{taskingrequestId}:
    parameters:
    - $ref: '#/components/parameters/TaskingRequestId'
    get:
      tags:
      - Collects
      summary: List collects for a tasking request
      responses:
        '200':
          description: Collect list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
      operationId: getCollectsListByTaskingrequestId
      x-operation-id-source: derived
components:
  parameters:
    TaskingRequestId:
      in: path
      name: taskingrequestId
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token issued via the Capella Console. API keys can be

        requested at POST /keys and exchanged for bearer tokens per the

        documented authentication flow.

        '
