apis:
  - aid: capella-space:capella-tasking-api
    name: Capella Space Tasking API
    description: The Capella Tasking API lets customers submit imagery tasking requests against the
      Capella SAR constellation, configure collect parameters (geometry, resolution, polarization,
      look direction, off-nadir angle), monitor tasking and collect statuses, and manage repeat
      tasking. Supports 15-minute scheduling cycles and flexible collection tiers.
    humanURL: https://docs.capellaspace.com/api/tasking/
    baseURL: https://api.capellaspace.com
    tags:
      - Tasking
      - SAR
      - Collects
      - Scheduling
    properties:
      - type: Documentation
        url: https://docs.capellaspace.com/api/tasking/
      - type: Authentication
        url: https://docs.capellaspace.com/
      - type: Signup
        url: https://console.capellaspace.com/
    contact:
      - FN: Capella Space Support
        url: https://support.capellaspace.com/
  - aid: capella-space:capella-catalog-api
    name: Capella Space Catalog API
    description: The Capella Catalog API is a STAC-compliant search interface over the archive of
      SAR collects. Clients query the catalog by geometry, time, product type, resolution, and
      polarization to discover scenes available for ordering and download.
    humanURL: https://docs.capellaspace.com/api/catalog/
    baseURL: https://api.capellaspace.com
    tags:
      - Catalog
      - STAC
      - Search
      - Discovery
    properties:
      - type: Documentation
        url: https://docs.capellaspace.com/api/catalog/
      - type: Authentication
        url: https://docs.capellaspace.com/
    contact:
      - FN: Capella Space Support
        url: https://support.capellaspace.com/
  - aid: capella-space:capella-orders-api
    name: Capella Space Orders API
    description: The Capella Orders API submits and tracks orders for SAR products, manages order
      lifecycle, and returns signed download URLs for completed imagery via endpoints such as
      GET /orders/{orderId}/download.
    humanURL: https://docs.capellaspace.com/accessing-data/ordering-and-downloading/
    baseURL: https://api.capellaspace.com
    tags:
      - Orders
      - Download
      - Fulfillment
    properties:
      - type: Documentation
        url: https://docs.capellaspace.com/accessing-data/ordering-and-downloading/
      - type: Authentication
        url: https://docs.capellaspace.com/
    contact:
      - FN: Capella Space Support
        url: https://support.capellaspace.com/
